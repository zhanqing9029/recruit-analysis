<!-- 窄屏适配：宽表格改为内部横向滚动，避免把整页撑宽；长链接不溢出 -->
<style>
  .markdown-body { overflow-wrap: break-word; }
  .markdown-body img { max-width: 100%; height: auto; }

  @media (max-width: 700px) {
    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-body { padding-left: 14px; padding-right: 14px; }
    .markdown-body h1 { font-size: 1.55em; line-height: 1.3; }
  }
</style>
